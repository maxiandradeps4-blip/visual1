<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>El rescate de Mowat</title><style>html,body,iframe{margin:0;width:100%;height:100%;border:0;background:#000;overflow:hidden}iframe{display:block}</style></head><body><iframe id="game" src="base.html" allow="autoplay"></iframe><script>const lines=["CRIS: Veo las luces respirando. Estoy demasiado drogao.","EL MAXI: Hermano, estoy demasiado drogao para esta velocidad.","CRIS: No sé si esa micro existe o la estoy alucinando.","EL MAXI: Creo que el mapa se está derritiendo.","CRIS: La Torre Entel está vibrando. Debe ser la droga.","EL MAXI: Casi chocamos, estoy drogao.","CRIS: Siento que llevamos tres horas manejando. Estoy volando.","EL MAXI: No sé si estoy viendo doble o vienen dos taxis.","CRIS: Santiago se puso psicodélico de repente.","EL MAXI: Mowat, aguanta, estamos sobreviviendo químicamente.","CRIS: Esa luz roja me está hablando, compadre.","EL MAXI: Todo se mueve lento y nosotros vamos a doscientos."];const crash=["EL MAXI: Casi chocamos, estoy drogao.","CRIS: Esa wea casi nos mata, estoy volando.","EL MAXI: Casi chocamos, veo todo en cámara lenta.","CRIS: No sé si chocamos o lo imaginé."];const f=document.getElementById('game');f.addEventListener('load',()=>{const d=f.contentDocument,dlg=d.getElementById('dialogue');if(!dlg)return;let lock=false;const rewrite=()=>{if(lock||!dlg.classList.contains('show'))return;lock=true;const isCrash=/choc|dimos|auto aguanta|sigue/i.test(dlg.textContent);const pool=isCrash?crash:lines;dlg.textContent=pool[Math.floor(Math.random()*pool.length)];setTimeout(()=>lock=false,40)};new MutationObserver(rewrite).observe(dlg,{childList:true,characterData:true,subtree:true,attributes:true,attributeFilter:['class']});rewrite()});</script></body></html>
