<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Glitch tipográfico reactivo</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #fff;
  }
  body {
    background: #fff;
    font-family: Georgia, "Times New Roman", serif;
  }
  canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }
  #toggleMic {
    position: fixed;
    z-index: 20;
    left: 18px;
    top: 18px;
    border: 1px solid #000;
    background: #fff;
    color: #000;
    padding: 10px 14px;
    min-height: 42px;
    font: 700 11px/1 Arial, sans-serif;
    letter-spacing: .12em;
    text-transform: uppercase;
    cursor: pointer;
    mix-blend-mode: difference;
  }
  #toggleMic:hover {
    background: #000;
    color: #fff;
  }
</style>
</head>
<body>
<canvas id="view"></canvas>
<button id="toggleMic">Activar o desactivar el micrófono</button>

<script>
(() => {
  const canvas = document.getElementById('view');
  const ctx = canvas.getContext('2d', { alpha: false });
  const button = document.getElementById('toggleMic');

  let W = innerWidth, H = innerHeight;
  let dpr = Math.min(window.devicePixelRatio || 1, 2);

  const scene = document.createElement('canvas');
  const sctx = scene.getContext('2d', { willReadFrequently: true });
  const textBuf = document.createElement('canvas');
  const tctx = textBuf.getContext('2d');

  let sceneScale = 0.18;      // bajo para pixelar
  let sw = 320, sh = 180;

  let audioCtx = null;
  let analyser = null;
  let stream = null;
  let micActive = false;
  let freqData = null;
  let timeData = null;
  let prevFreq = null;

  let smoothLevel = 0;
  let lowEnergy = 0;
  let highEnergy = 0;
  let pulse = 0;
  let fluxAvg = 0;
  let frame = 0;

  const calmWords = [
    'sonido','eco','cariño','afecto','prueba','onda','escucha'
  ];

  const denseWords = [
    'SONIDO','RUIDO','ECO','PULSO','CARIÑO','AFECTO','EXPERIMENTO',
    'ONDA','SEÑAL','VIBRA','LATIDO','RESONANCIA','TEMBLOR',
    '////','†','‡','≠','∞','▓▓','▒▒','[]','()','+','×','◼'
  ];

  let items = [];

  function rnd(a,b){ return a + Math.random() * (b - a); }
  function pick(arr){ return arr[(Math.random() * arr.length) | 0]; }
  function clamp(v,a,b){ return Math.max(a, Math.min(b, v)); }
  function lerp(a,b,t){ return a + (b-a) * t; }

  class Item {
    constructor(text, x, y, size, opts = {}) {
      this.text = text;
      this.baseX = x; this.baseY = y;
      this.x = x; this.y = y;
      this.size = size;
      this.weight = opts.weight ?? 900;
      this.italic = opts.italic ?? true;
      this.rot = opts.rot ?? rnd(-0.12, 0.12);
      this.baseRot = this.rot;
      this.alpha = opts.alpha ?? 1;
      this.kind = opts.kind ?? 'dense';
      this.anchor = opts.anchor ?? false;
      this.scaleX = opts.scaleX ?? rnd(0.84, 1.12);
      this.scaleY = opts.scaleY ?? rnd(0.88, 1.04);
      this.floatAmpX = opts.floatAmpX ?? rnd(12, 28);
      this.floatAmpY = opts.floatAmpY ?? rnd(8, 20);
      this.floatSpeed = opts.floatSpeed ?? rnd(0.15, 0.45);
      this.phase = rnd(0, Math.PI * 2);
      this.vx = 0; this.vy = 0; this.vr = 0;
    }
    kick(power){
      this.vx += rnd(-1,1) * power * (this.anchor ? 14 : 8);
      this.vy += rnd(-1,1) * power * (this.anchor ? 8 : 5);
      this.vr += rnd(-1,1) * power * 0.08;
    }
    update(audio){
      this.phase += 0.004 + audio.level * 0.013 + audio.high * 0.01;

      const calmX = this.baseX + Math.sin(this.phase * this.floatSpeed) * this.floatAmpX;
      const calmY = this.baseY + Math.cos(this.phase * this.floatSpeed * 0.81) * this.floatAmpY;

      const move = 1 + audio.level * 18 + audio.low * 10;
      const jitter = audio.pulse * (this.anchor ? 24 : 14) + audio.high * 4;

      const targetX = calmX + Math.sin(frame * 0.03 + this.phase * 1.3) * move + rnd(-jitter, jitter);
      const targetY = calmY + Math.cos(frame * 0.025 + this.phase * 1.1) * move + rnd(-jitter, jitter) * 0.55;

      this.x += (targetX - this.x) * (0.08 + audio.level * 0.08);
      this.y += (targetY - this.y) * (0.08 + audio.level * 0.08);

      this.vx *= 0.90;
      this.vy *= 0.90;
      this.vr *= 0.90;

      this.x += this.vx;
      this.y += this.vy;
      this.rot += this.vr;

      const targetRot = this.baseRot + Math.sin(this.phase) * 0.03 + rnd(-1,1) * audio.pulse * 0.12;
      this.rot += (targetRot - this.rot) * 0.08;
    }
  }

  function resize(){
    W = innerWidth;
    H = innerHeight;
    dpr = Math.min(window.devicePixelRatio || 1, 2);

    canvas.width = W * dpr;
    canvas.height = H * dpr;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    const minSide = Math.min(W, H);
    sceneScale = minSide > 1200 ? 0.16 : minSide > 900 ? 0.18 : 0.22;
    sw = Math.max(180, Math.round(W * sceneScale));
    sh = Math.max(120, Math.round(H * sceneScale));
    scene.width = sw;
    scene.height = sh;

    buildComposition();
  }

  function buildComposition(){
    items = [];

    const calmCount = Math.max(5, Math.min(9, Math.round(W / 280)));
    for (let i = 0; i < calmCount; i++) {
      items.push(new Item(
        pick(calmWords),
        rnd(W * 0.12, W * 0.88),
        rnd(H * 0.16, H * 0.86),
        rnd(18, Math.min(48, W * 0.038)),
        {
          kind: 'calm',
          weight: Math.random() < 0.45 ? 400 : 700,
          italic: Math.random() < 0.8,
          alpha: rnd(0.42, 0.8),
          rot: rnd(-0.05, 0.05),
          scaleX: rnd(0.96, 1.05),
          scaleY: rnd(0.96, 1.03),
          floatAmpX: rnd(16, 34),
          floatAmpY: rnd(10, 26),
          floatSpeed: rnd(0.18, 0.42)
        }
      ));
    }

    const anchors = [
      ['SONIDO', W * 0.24, H * 0.22, Math.min(W,H) * 0.24, -0.08],
      ['RUIDO',  W * 0.66, H * 0.28, Math.min(W,H) * 0.21,  0.08],
      ['CARIÑO', W * 0.32, H * 0.54, Math.min(W,H) * 0.24, -0.04],
      ['ECO',    W * 0.71, H * 0.74, Math.min(W,H) * 0.25, -0.06],
      ['PULSO',  W * 0.18, H * 0.84, Math.min(W,H) * 0.16,  0.03],
    ];

    for (const [t,x,y,s,r] of anchors){
      items.push(new Item(t, x, y, s, {
        kind: 'dense',
        weight: 900,
        italic: true,
        alpha: 1,
        rot: r,
        scaleX: rnd(0.84, 1.1),
        scaleY: rnd(0.90, 1.04),
        floatAmpX: rnd(8, 22),
        floatAmpY: rnd(8, 18),
        floatSpeed: rnd(0.12, 0.28),
        anchor: true
      }));
    }

    const extraCount = Math.max(10, Math.min(20, Math.round(W / 110)));
    for (let i = 0; i < extraCount; i++) {
      items.push(new Item(
        pick(denseWords),
        rnd(-W * 0.05, W * 1.02),
        rnd(H * 0.04, H * 0.98),
        rnd(Math.min(W,H) * 0.08, Math.min(W,H) * 0.18),
        {
          kind: 'dense',
          weight: Math.random() < 0.84 ? 900 : 700,
          italic: true,
          alpha: rnd(0.72, 1),
          rot: rnd(-0.18, 0.18),
          scaleX: rnd(0.82, 1.18),
          scaleY: rnd(0.88, 1.08),
          floatAmpX: rnd(10, 26),
          floatAmpY: rnd(8, 20),
          floatSpeed: rnd(0.16, 0.36),
          anchor: Math.random() < 0.18
        }
      ));
    }
  }

  function drawTextGlitch(item, audio){
    const x = item.x * sceneScale;
    const y = item.y * sceneScale;
    const size = Math.max(8, item.size * sceneScale);

    const w = Math.max(80, Math.ceil(size * (item.text.length * 0.85 + 2.4) * 1.6));
    const h = Math.max(36, Math.ceil(size * 2.2));
    textBuf.width = w;
    textBuf.height = h;

    tctx.setTransform(1, 0, 0, 1, 0, 0);
    tctx.clearRect(0, 0, w, h);
    tctx.translate(w / 2, h / 2);
    tctx.scale(item.scaleX, item.scaleY);
    tctx.fillStyle = '#000';
    tctx.textAlign = 'center';
    tctx.textBaseline = 'middle';
    tctx.font = `${item.italic ? 'italic ' : ''}${item.weight} ${size}px Georgia, "Times New Roman", serif`;
    tctx.fillText(item.text, 0, 0);

    // eco tipográfico para mayor densidad
    const echoAlpha = clamp(0.08 + audio.level * 0.12 + audio.pulse * 0.18, 0.06, 0.22);
    tctx.globalAlpha = echoAlpha;
    tctx.fillText(item.text, -size * 0.05, 0);
    tctx.fillText(item.text,  size * 0.05, 0);
    tctx.globalAlpha = 1;

    sctx.save();
    sctx.translate(x, y);
    sctx.rotate(item.rot);

    const intensity = clamp(audio.level * 0.8 + audio.pulse * 1.1 + audio.high * 0.4, 0, 1);
    const baseSlice = Math.max(1, Math.floor(size * 0.08));
    const amp = intensity * (size * 0.7 + 10);

    if (intensity < 0.05) {
      sctx.globalAlpha = item.alpha;
      sctx.drawImage(textBuf, -w/2, -h/2);
      sctx.restore();
      return;
    }

    let yy = 0;
    while (yy < h) {
      const shh = Math.max(1, Math.floor(rnd(baseSlice * 0.7, baseSlice * 1.9)));
      const step = Math.floor(yy / Math.max(1, baseSlice));
      const dx = Math.sin(step * 0.75 + frame * 0.03 + item.phase) * amp
               + (Math.random() - 0.5) * amp * 0.8;

      sctx.globalAlpha = item.alpha;
      sctx.drawImage(textBuf, 0, yy, w, shh, -w/2 + dx, -h/2 + yy, w, shh);

      if (audio.pulse > 0.05 && Math.random() < 0.75) {
        const copies = Math.min(6, Math.floor(1 + audio.pulse * 8));
        for (let c = 1; c <= copies; c++) {
          const stepOff = c * Math.max(1, Math.floor(size * 0.05));
          sctx.globalAlpha = clamp(0.12 - c * 0.016 + audio.pulse * 0.08, 0.02, 0.12);
          sctx.drawImage(textBuf, 0, yy, w, shh, -w/2 + dx - stepOff, -h/2 + yy + c * 0.35, w, shh);
        }
      }
      yy += shh;
    }

    sctx.globalAlpha = 1;
    sctx.restore();
  }

  function renderScene(audio){
    sctx.setTransform(1,0,0,1,0,0);
    sctx.clearRect(0,0,sw,sh);
    sctx.fillStyle = '#fff';
    sctx.fillRect(0,0,sw,sh);

    const calmOpacity = clamp(1 - audio.level * 1.35 - audio.pulse * 1.8, 0.08, 1);
    const denseOpacity = clamp(audio.level * 1.25 + audio.pulse * 1.5 + 0.08, 0.06, 1);

    for (const item of items) {
      item.update(audio);

      sctx.save();
      if (item.kind === 'calm') sctx.globalAlpha *= calmOpacity;
      else sctx.globalAlpha *= denseOpacity;
      drawTextGlitch(item, audio);
      sctx.restore();
    }

    // barras y ruido gráfico
    const barCount = Math.floor(2 + audio.high * 12 + audio.pulse * 14);
    sctx.save();
    sctx.globalAlpha = clamp(audio.high * 0.18 + audio.pulse * 0.12, 0, 0.22);
    sctx.fillStyle = '#000';
    for (let i = 0; i < barCount; i++) {
      sctx.fillRect(rnd(0, sw), rnd(0, sh), rnd(sw * 0.04, sw * 0.32), rnd(1, 3));
    }
    sctx.restore();

    // glitch de pantalla por slices
    if (audio.pulse > 0.05 || audio.level > 0.1) {
      const sliceCount = Math.floor(2 + audio.pulse * 14 + audio.high * 8);
      const amp = Math.floor(2 + audio.pulse * 18 + audio.level * 8);
      for (let i = 0; i < sliceCount; i++) {
        const y = Math.floor(rnd(0, sh));
        const hh = Math.max(1, Math.floor(rnd(1, Math.max(2, 4 + audio.pulse * 10))));
        const dx = Math.floor(rnd(-amp, amp));
        try {
          const img = sctx.getImageData(0, y, sw, hh);
          sctx.putImageData(img, dx, y);
        } catch(e) {}
      }
    }

    // threshold + ruido
    const img = sctx.getImageData(0, 0, sw, sh);
    const px = img.data;
    const thresh = Math.floor(210 - audio.level * 42 - audio.pulse * 55); // más threshold cuando suena
    const noiseAmt = 18 + audio.level * 24 + audio.pulse * 34;

    for (let i = 0; i < px.length; i += 4) {
      const lum = 0.2126 * px[i] + 0.7152 * px[i+1] + 0.0722 * px[i+2];
      const n = (Math.random() - 0.5) * noiseAmt;
      const v = (lum + n > thresh) ? 255 : 0;

      // puntitos sueltos adicionales, como threshold roto
      let vv = v;
      if (Math.random() < 0.006 + audio.pulse * 0.015) {
        vv = vv === 255 ? 0 : 255;
      }

      px[i] = vv;
      px[i+1] = vv;
      px[i+2] = vv;
      px[i+3] = 255;
    }
    sctx.putImageData(img, 0, 0);

    // scanlines pixeladas
    sctx.save();
    sctx.globalAlpha = clamp(0.04 + audio.high * 0.05 + audio.pulse * 0.04, 0.03, 0.12);
    sctx.fillStyle = '#000';
    for (let y = (frame % 3); y < sh; y += 3) {
      sctx.fillRect(0, y, sw, 1);
    }
    sctx.restore();
  }

  function presentScene(audio){
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.imageSmoothingEnabled = false;
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, W, H);

    // pasada principal
    ctx.drawImage(scene, 0, 0, W, H);

    // ghost glitch adicional en los beats
    if (audio.pulse > 0.06) {
      ctx.save();
      ctx.imageSmoothingEnabled = false;
      ctx.globalAlpha = clamp(audio.pulse * 0.18, 0.04, 0.18);
      const dx = Math.floor(rnd(-18, 18));
      const dy = Math.floor(rnd(-4, 4));
      ctx.drawImage(scene, dx, dy, W, H);
      ctx.restore();
    }
  }

  function getAudio(){
    if (!analyser || !freqData || !timeData) {
      pulse *= 0.88;
      return { level: 0, low: 0, high: 0, pulse, calm: true };
    }

    analyser.getByteFrequencyData(freqData);
    analyser.getByteTimeDomainData(timeData);

    let low = 0, high = 0, all = 0;
    const n = freqData.length;
    const lowEnd = Math.floor(n * 0.10);
    const highStart = Math.floor(n * 0.28);

    for (let i = 0; i < n; i++) {
      const v = freqData[i] / 255;
      all += v;
      if (i < lowEnd) low += v;
      if (i >= highStart) high += v;
    }
    low /= Math.max(1, lowEnd);
    high /= Math.max(1, n - highStart);
    all /= n;

    let sum = 0;
    for (let i = 0; i < timeData.length; i++) {
      const v = (timeData[i] - 128) / 128;
      sum += v * v;
    }
    const rms = Math.sqrt(sum / timeData.length);
    const level = clamp(all * 0.7 + rms * 1.7, 0, 1);

    if (!prevFreq) prevFreq = new Float32Array(n);
    let flux = 0;
    for (let i = 0; i < n; i++) {
      const curr = freqData[i] / 255;
      const diff = curr - prevFreq[i];
      if (diff > 0) flux += diff;
      prevFreq[i] = curr;
    }
    flux /= n;
    fluxAvg = lerp(fluxAvg, flux, 0.12);

    const onset = flux > fluxAvg * 1.55 + 0.012;
    pulse *= 0.86;

    if (onset) {
      const power = clamp(flux * 9 + low * 0.8 + 0.12, 0, 1);
      pulse = Math.max(pulse, power);
      items.forEach(it => {
        if (Math.random() < (it.anchor ? 0.92 : 0.55)) it.kick(0.35 + power * 0.9);
      });
    }

    smoothLevel += (level - smoothLevel) * (level > smoothLevel ? 0.24 : 0.08);
    lowEnergy += (low - lowEnergy) * 0.18;
    highEnergy += (high - highEnergy) * 0.18;

    return {
      level: smoothLevel,
      low: lowEnergy,
      high: highEnergy,
      pulse: clamp(pulse, 0, 1),
      calm: smoothLevel < 0.05 && pulse < 0.04
    };
  }

  async function enableMic(){
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') await audioCtx.resume();

    stream = await navigator.mediaDevices.getUserMedia({
      audio: {
        echoCancellation: false,
        noiseSuppression: false,
        autoGainControl: false
      }
    });

    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 2048;
    analyser.smoothingTimeConstant = 0.12;

    freqData = new Uint8Array(analyser.frequencyBinCount);
    timeData = new Uint8Array(analyser.fftSize);
    prevFreq = new Float32Array(analyser.frequencyBinCount);

    const src = audioCtx.createMediaStreamSource(stream);
    src.connect(analyser);
    micActive = true;
  }

  function disableMic(){
    if (stream) {
      stream.getTracks().forEach(t => t.stop());
      stream = null;
    }
    analyser = null;
    freqData = null;
    timeData = null;
    prevFreq = null;
    micActive = false;
    smoothLevel = 0;
    lowEnergy = 0;
    highEnergy = 0;
    pulse = 0;
    fluxAvg = 0;
  }

  async function toggleMic(){
    try {
      if (!micActive) await enableMic();
      else disableMic();
    } catch (err) {
      console.error(err);
      disableMic();
    }
  }

  function render(){
    frame++;
    const audio = getAudio();
    renderScene(audio);
    presentScene(audio);
    requestAnimationFrame(render);
  }

  button.addEventListener('click', toggleMic);
  window.addEventListener('resize', resize);

  resize();
  render();
})();
</script>
</body>
</html>
