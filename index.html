<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Glitch tipográfico reactivo — responsive</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #fff;
  }
  body {
    background: #fff;
    font-family: Georgia, "Times New Roman", serif;
  }

  canvas#view {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }

  #ui {
    position: fixed;
    z-index: 30;
    top: max(16px, env(safe-area-inset-top));
    left: max(16px, env(safe-area-inset-left));
    right: max(16px, env(safe-area-inset-right));
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
    pointer-events: none;
  }

  #toggleMic,
  #meterWrap {
    pointer-events: auto;
  }

  #toggleMic {
    border: 1px solid #000;
    background: #fff;
    color: #000;
    padding: 10px 14px;
    min-height: 42px;
    font: 700 clamp(10px, 1.2vw, 11px)/1 Arial, sans-serif;
    letter-spacing: .12em;
    text-transform: uppercase;
    cursor: pointer;
    mix-blend-mode: difference;
    max-width: min(78vw, 360px);
  }

  #toggleMic:hover {
    background: #000;
    color: #fff;
  }

  #meterWrap {
    width: min(30vw, 240px);
    min-width: 150px;
    background: rgba(255,255,255,.96);
    border: 1px solid #000;
    padding: 8px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    mix-blend-mode: difference;
  }

  #meterLabel {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    font: 700 10px/1 Arial, sans-serif;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: #000;
  }

  #meterCanvas {
    width: 100%;
    height: 48px;
    display: block;
    background: #fff;
    border: 1px solid #000;
    image-rendering: pixelated;
  }

  #levelBar {
    width: 100%;
    height: 8px;
    background: #fff;
    border: 1px solid #000;
    position: relative;
    overflow: hidden;
  }

  #levelFill {
    position: absolute;
    inset: 0 auto 0 0;
    width: 0%;
    background: #000;
  }

  @media (max-width: 720px) {
    #ui {
      flex-direction: column;
      align-items: stretch;
    }

    #toggleMic {
      max-width: none;
      width: 100%;
    }

    #meterWrap {
      width: 100%;
      min-width: 0;
    }
  }
</style>
</head>
<body>
<canvas id="view"></canvas>

<div id="ui">
  <button id="toggleMic">Activar o desactivar el micrófono</button>

  <div id="meterWrap" aria-label="Visualizador de sonido de entrada">
    <div id="meterLabel">
      <span>Entrada</span>
      <span id="levelText">0%</span>
    </div>
    <canvas id="meterCanvas"></canvas>
    <div id="levelBar"><div id="levelFill"></div></div>
  </div>
</div>

<script>
(() => {
  const canvas = document.getElementById('view');
  const ctx = canvas.getContext('2d', { alpha: false });

  const button = document.getElementById('toggleMic');
  const meterCanvas = document.getElementById('meterCanvas');
  const mctx = meterCanvas.getContext('2d', { alpha: false });
  const levelFill = document.getElementById('levelFill');
  const levelText = document.getElementById('levelText');

  const scene = document.createElement('canvas');
  const sctx = scene.getContext('2d', { willReadFrequently: true });

  const textBuf = document.createElement('canvas');
  const tctx = textBuf.getContext('2d');

  let W = innerWidth, H = innerHeight;
  let dpr = Math.min(devicePixelRatio || 1, 2);

  let sw = 320, sh = 180;
  let sceneScale = 0.18;

  let audioCtx = null;
  let analyser = null;
  let stream = null;
  let freqData = null;
  let timeData = null;
  let prevFreq = null;
  let micActive = false;

  let smoothLevel = 0;
  let lowEnergy = 0;
  let midEnergy = 0;
  let highEnergy = 0;
  let pulse = 0;
  let fluxAvg = 0;
  let frame = 0;
  let redGlitch = 0;
  let lastRedGlitch = 0;

  // Mutación lenta durante el silencio
  let silenceStartedAt = performance.now();
  let lastSilenceMutation = 0;
  let nextSilenceMutation = 1700;

  const SENSITIVITY = 1.35;   // mayor sensibilidad general
  const ONSET_BIAS = 0.009;   // menor umbral para ataques
  const calmWords = ['sonido','eco','cariño','afecto','escucha','onda','prueba'];
  const denseWords = [
    'SONIDO','RUIDO','ECO','PULSO','CARIÑO','AFECTO','VIBRA','ONDA',
    'SEÑAL','LATIDO','RESONANCIA','TEMBLOR','EXPERIMENTO',
    '////','†','‡','×','∞','▓▓','▒▒','[]','()','+','◼'
  ];

  let items = [];

  function rnd(a,b){ return a + Math.random()*(b-a); }
  function pick(arr){ return arr[(Math.random()*arr.length)|0]; }
  function clamp(v,a,b){ return Math.max(a, Math.min(b, v)); }
  function lerp(a,b,t){ return a + (b-a)*t; }

  class Item {
    constructor(text, x, y, size, opts = {}) {
      this.text = text;
      this.baseX = x;
      this.baseY = y;
      this.x = x;
      this.y = y;
      this.baseSize = size;
      this.size = size;
      this.weight = opts.weight ?? 900;
      this.italic = opts.italic ?? true;
      this.alpha = opts.alpha ?? 1;
      this.kind = opts.kind ?? 'dense';
      this.anchor = opts.anchor ?? false;
      this.response = opts.response ?? 'mix'; // low, mid, high, mix
      this.scaleX = opts.scaleX ?? rnd(0.84, 1.12);
      this.scaleY = opts.scaleY ?? rnd(0.88, 1.05);
      this.baseRot = opts.rot ?? rnd(-0.14, 0.14);
      this.rot = this.baseRot;
      this.phase = rnd(0, Math.PI * 2);
      this.floatAmpX = opts.floatAmpX ?? rnd(10, 24);
      this.floatAmpY = opts.floatAmpY ?? rnd(8, 18);
      this.floatSpeed = opts.floatSpeed ?? rnd(0.14, 0.4);

      this.vx = 0;
      this.vy = 0;
      this.vr = 0;

      this.currentScale = 1;
      this.targetScale = 1;
      this.bandPhase = rnd(0, Math.PI * 2);
      this.sliceBias = opts.sliceBias ?? rnd(0.45, 1.2);
    }

    bandValue(audio) {
      if (this.response === 'low') return audio.low;
      if (this.response === 'mid') return audio.mid;
      if (this.response === 'high') return audio.high;
      return audio.level * 0.45 + audio.low * 0.2 + audio.mid * 0.2 + audio.high * 0.15;
    }

    kick(power) {
      this.vx += rnd(-1,1) * power * (this.anchor ? 12 : 7);
      this.vy += rnd(-1,1) * power * (this.anchor ? 8 : 4.5);
      this.vr += rnd(-1,1) * power * 0.08;
    }

    update(audio) {
      const band = this.bandValue(audio);
      this.phase += 0.004 + audio.level * 0.015 + audio.high * 0.006;

      const calmX = this.baseX + Math.sin(this.phase * this.floatSpeed) * this.floatAmpX;
      const calmY = this.baseY + Math.cos(this.phase * this.floatSpeed * 0.82) * this.floatAmpY;

      let moveX = 0, moveY = 0, rotPush = 0;

      if (this.response === 'low') {
        moveY += Math.sin(frame * 0.06 + this.bandPhase) * (5 + audio.low * 26);
        moveX += Math.cos(frame * 0.03 + this.bandPhase) * (1 + audio.low * 5);
      } else if (this.response === 'mid') {
        moveX += Math.sin(frame * 0.08 + this.bandPhase) * (4 + audio.mid * 28);
        moveY += Math.cos(frame * 0.035 + this.bandPhase) * (1 + audio.mid * 8);
        rotPush += Math.sin(frame * 0.045 + this.bandPhase) * (0.02 + audio.mid * 0.18);
      } else if (this.response === 'high') {
        moveX += rnd(-1,1) * (1 + audio.high * 18 + audio.pulse * 8);
        moveY += rnd(-1,1) * (1 + audio.high * 8);
        rotPush += rnd(-1,1) * (audio.high * 0.18 + audio.pulse * 0.12);
      } else {
        moveX += Math.sin(frame * 0.05 + this.bandPhase) * (3 + audio.level * 20 + audio.mid * 8);
        moveY += Math.cos(frame * 0.04 + this.bandPhase) * (3 + audio.level * 18 + audio.low * 10);
        rotPush += Math.sin(frame * 0.03 + this.bandPhase) * (0.01 + audio.high * 0.08);
      }

      // ESCALA REACTIVA:
      // casi silencio = pequeño / golpes = crecimiento brusco.
      const quietBase = this.kind === 'calm' ? 0.48 : 0.38;
      const levelGrowth = audio.level * (this.anchor ? 0.95 : 0.72);
      const beatGrowth = audio.pulse * (this.anchor ? 1.35 : 0.95);

      if (this.response === 'low') {
        this.targetScale = quietBase + levelGrowth + audio.low * 0.72 + beatGrowth;
      } else if (this.response === 'mid') {
        this.targetScale = quietBase + levelGrowth + audio.mid * 0.52 + beatGrowth * 0.82;
      } else if (this.response === 'high') {
        this.targetScale = quietBase + levelGrowth * 0.72 + audio.high * 0.36 + beatGrowth * 0.68;
      } else {
        this.targetScale = quietBase + levelGrowth + beatGrowth;
      }

      // En un golpe fuerte algunas palabras pueden llegar a más del doble.
      this.targetScale = clamp(this.targetScale, 0.34, this.anchor ? 2.7 : 2.15);

      // Ataque rápido al crecer, relajación más lenta al volver a pequeño.
      const scaleEase = this.targetScale > this.currentScale
        ? 0.30 + audio.pulse * 0.22
        : 0.075;

      this.currentScale += (this.targetScale - this.currentScale) * scaleEase;

      const targetX = calmX + moveX;
      const targetY = calmY + moveY;

      this.x += (targetX - this.x) * (0.07 + audio.level * 0.1);
      this.y += (targetY - this.y) * (0.07 + audio.level * 0.1);

      this.vx *= 0.90;
      this.vy *= 0.90;
      this.vr *= 0.90;

      this.x += this.vx;
      this.y += this.vy;

      const desiredRot = this.baseRot + rotPush + Math.sin(this.phase) * 0.015;
      this.rot += (desiredRot - this.rot) * 0.12 + this.vr;
    }
  }

  function sizeMeterCanvas() {
    const rect = meterCanvas.getBoundingClientRect();
    const mdpr = Math.min(devicePixelRatio || 1, 2);
    meterCanvas.width = Math.max(120, Math.round(rect.width * mdpr));
    meterCanvas.height = Math.max(36, Math.round(rect.height * mdpr));
    mctx.setTransform(mdpr, 0, 0, mdpr, 0, 0);
  }

  function resize() {
    W = innerWidth;
    H = innerHeight;
    dpr = Math.min(devicePixelRatio || 1, 2);

    canvas.width = W * dpr;
    canvas.height = H * dpr;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    // Ajuste más robusto para pantallas de cualquier proporción
    const minSide = Math.min(W, H);
    const aspect = W / H;
    if (aspect > 2) sceneScale = 0.14;
    else if (aspect > 1.5) sceneScale = 0.16;
    else if (minSide > 1200) sceneScale = 0.16;
    else if (minSide > 900) sceneScale = 0.18;
    else sceneScale = 0.22;

    sw = Math.max(180, Math.round(W * sceneScale));
    sh = Math.max(120, Math.round(H * sceneScale));
    scene.width = sw;
    scene.height = sh;

    sizeMeterCanvas();
    buildComposition();
  }

  function buildComposition() {
    items = [];

    const calmCount = Math.max(5, Math.min(8, Math.round(W / 320)));
    for (let i = 0; i < calmCount; i++) {
      items.push(new Item(
        pick(calmWords),
        rnd(W * 0.24, W * 0.76),
        rnd(H * 0.24, H * 0.76),
        rnd(18, Math.min(44, W * 0.036)),
        {
          kind: 'calm',
          weight: Math.random() < 0.5 ? 400 : 700,
          italic: Math.random() < 0.8,
          alpha: rnd(0.35, 0.8),
          rot: rnd(-0.05, 0.05),
          response: pick(['low','mid','high','mix']),
          scaleX: rnd(0.95, 1.05),
          scaleY: rnd(0.96, 1.03),
          floatAmpX: rnd(12, 28),
          floatAmpY: rnd(10, 22),
          floatSpeed: rnd(0.18, 0.38),
          sliceBias: rnd(0.3, 0.65)
        }
      ));
      items[items.length - 1].currentScale = rnd(0.42, 0.56);
      items[items.length - 1].targetScale = items[items.length - 1].currentScale;
    }

    const anchors = [
      ['SONIDO', W * 0.34, H * 0.28, Math.min(W,H) * 0.24, -0.08, 'low'],
      ['RUIDO',  W * 0.62, H * 0.34, Math.min(W,H) * 0.20,  0.08, 'mid'],
      ['CARIÑO', W * 0.42, H * 0.53, Math.min(W,H) * 0.23, -0.04, 'low'],
      ['ECO',    W * 0.62, H * 0.67, Math.min(W,H) * 0.24, -0.07, 'high'],
      ['PULSO',  W * 0.34, H * 0.70, Math.min(W,H) * 0.16,  0.03, 'mix'],
    ];

    for (const [t,x,y,s,r,resp] of anchors) {
      items.push(new Item(t, x, y, s, {
        kind: 'dense',
        weight: 900,
        italic: true,
        alpha: 1,
        rot: r,
        response: resp,
        anchor: true,
        scaleX: rnd(0.84, 1.10),
        scaleY: rnd(0.90, 1.04),
        floatAmpX: rnd(8, 18),
        floatAmpY: rnd(8, 16),
        floatSpeed: rnd(0.12, 0.24),
        sliceBias: rnd(0.8, 1.2)
      }));
    }

    const extraCount = Math.max(10, Math.min(18, Math.round(W / 120)));
    const responses = ['low','mid','high','mix'];
    for (let i = 0; i < extraCount; i++) {
      const resp = responses[i % responses.length];
      items.push(new Item(
        pick(denseWords),
        rnd(W * 0.14, W * 0.86),
        rnd(H * 0.14, H * 0.86),
        rnd(Math.min(W,H) * 0.08, Math.min(W,H) * 0.17),
        {
          kind: 'dense',
          weight: Math.random() < 0.82 ? 900 : 700,
          italic: true,
          alpha: rnd(0.7, 1),
          rot: rnd(-0.18, 0.18),
          response: resp,
          anchor: Math.random() < 0.18,
          scaleX: rnd(0.82, 1.18),
          scaleY: rnd(0.88, 1.08),
          floatAmpX: rnd(10, 24),
          floatAmpY: rnd(8, 18),
          floatSpeed: rnd(0.16, 0.34),
          sliceBias: rnd(0.45, 1.1)
        }
      ));
    }
  }

  function drawWord(item, audio) {
    const size = Math.max(8, item.baseSize * item.currentScale * sceneScale);
    const x = item.x * sceneScale;
    const y = item.y * sceneScale;

    const textW = Math.max(80, Math.ceil(size * (item.text.length * 0.86 + 2.3) * 1.5));
    const textH = Math.max(34, Math.ceil(size * 2.15));
    textBuf.width = textW;
    textBuf.height = textH;

    tctx.setTransform(1,0,0,1,0,0);
    tctx.clearRect(0,0,textW,textH);
    tctx.translate(textW / 2, textH / 2);
    tctx.scale(item.scaleX, item.scaleY);
    tctx.textAlign = 'center';
    tctx.textBaseline = 'middle';
    tctx.fillStyle = '#000';
    tctx.font = `${item.italic ? 'italic ' : ''}${item.weight} ${size}px Georgia, "Times New Roman", serif`;
    tctx.fillText(item.text, 0, 0);

    const ghost = clamp(0.08 + audio.level * 0.1 + audio.pulse * 0.14, 0.06, 0.20);
    tctx.globalAlpha = ghost;
    tctx.fillText(item.text, -size * 0.05, 0);
    tctx.fillText(item.text,  size * 0.05, 0);
    tctx.globalAlpha = 1;

    sctx.save();
    sctx.translate(x, y);
    sctx.rotate(item.rot);

    const band = item.bandValue(audio);
    const intensity = clamp(audio.level * 0.55 + audio.pulse * 0.85 + band * 0.5, 0, 1);
    const baseSlice = Math.max(1, Math.floor(size * 0.08));
    const amp = intensity * (6 + size * 0.55) * item.sliceBias;
    const dxGlobal = item.response === 'mid'
      ? Math.sin(frame * 0.08 + item.phase) * amp * 0.22
      : 0;

    if (intensity < 0.045) {
      sctx.globalAlpha = item.alpha;
      sctx.drawImage(textBuf, -textW/2, -textH/2);
      sctx.restore();
      return;
    }

    let yy = 0;
    while (yy < textH) {
      const shh = Math.max(1, Math.floor(rnd(baseSlice * 0.7, baseSlice * 1.9)));
      const step = Math.floor(yy / Math.max(1, baseSlice));

      let dx = dxGlobal;

      if (item.response === 'low') {
        dx += Math.sin(step * 0.7 + frame * 0.03 + item.phase) * amp * 0.45;
      } else if (item.response === 'mid') {
        dx += Math.sin(step * 1.1 + frame * 0.055 + item.phase) * amp * 0.85;
      } else if (item.response === 'high') {
        dx += (Math.random() - 0.5) * amp * 1.25;
      } else {
        dx += Math.sin(step * 0.8 + frame * 0.04 + item.phase) * amp * 0.7
           + (Math.random() - 0.5) * amp * 0.35;
      }

      sctx.globalAlpha = item.alpha;
      sctx.drawImage(textBuf, 0, yy, textW, shh, -textW/2 + dx, -textH/2 + yy, textW, shh);

      if (audio.pulse > 0.035 && Math.random() < 0.76) {
        const copies = Math.min(7, Math.floor(1 + audio.pulse * 10 + band * 4));
        for (let c = 1; c <= copies; c++) {
          const stepOff = c * Math.max(1, Math.floor(size * 0.045));
          sctx.globalAlpha = clamp(0.12 - c * 0.016 + audio.pulse * 0.07, 0.02, 0.12);
          sctx.drawImage(
            textBuf, 0, yy, textW, shh,
            -textW/2 + dx - stepOff,
            -textH/2 + yy + c * 0.35,
            textW, shh
          );
        }
      }
      yy += shh;
    }

    sctx.globalAlpha = 1;
    sctx.restore();
  }

  function getAudio() {
    if (!analyser || !freqData || !timeData) {
      pulse *= 0.88;
      smoothLevel *= 0.92;
      lowEnergy *= 0.90;
      midEnergy *= 0.90;
      highEnergy *= 0.90;
      redGlitch *= 0.84;
      return { level: smoothLevel, low: lowEnergy, mid: midEnergy, high: highEnergy, pulse, red: redGlitch };
    }

    analyser.getByteFrequencyData(freqData);
    analyser.getByteTimeDomainData(timeData);

    const n = freqData.length;
    const lowEnd = Math.floor(n * 0.10);
    const midEnd = Math.floor(n * 0.32);
    const highEnd = Math.floor(n * 0.70);

    let low = 0, mid = 0, high = 0, all = 0;
    for (let i = 0; i < n; i++) {
      const v = freqData[i] / 255;
      all += v;
      if (i < lowEnd) low += v;
      else if (i < midEnd) mid += v;
      else if (i < highEnd) high += v;
    }

    low /= Math.max(1, lowEnd);
    mid /= Math.max(1, midEnd - lowEnd);
    high /= Math.max(1, highEnd - midEnd);
    all /= n;

    let sum = 0;
    for (let i = 0; i < timeData.length; i++) {
      const v = (timeData[i] - 128) / 128;
      sum += v * v;
    }
    const rms = Math.sqrt(sum / timeData.length);

    // más sensibilidad a sonidos bajos/medios
    const level = clamp((all * 0.85 + rms * 1.85) * SENSITIVITY, 0, 1);

    if (!prevFreq) prevFreq = new Float32Array(n);
    let flux = 0;
    for (let i = 0; i < n; i++) {
      const curr = freqData[i] / 255;
      const diff = curr - prevFreq[i];
      if (diff > 0) flux += diff;
      prevFreq[i] = curr;
    }
    flux /= n;
    fluxAvg = lerp(fluxAvg, flux, 0.1);

    const onset = flux > (fluxAvg * 1.42 + ONSET_BIAS);
    pulse *= 0.86;

    if (onset) {
      const power = clamp(flux * 10 + low * 0.7 + mid * 0.5 + 0.12, 0, 1);
      pulse = Math.max(pulse, power);

      items.forEach(item => {
        const band = item.bandValue({ level, low, mid, high, pulse });
        if (Math.random() < (item.anchor ? 0.92 : 0.55 + band * 0.25)) {
          item.kick(0.25 + power * 0.9 + band * 0.25);
        }
      });
    }

    smoothLevel += (level - smoothLevel) * (level > smoothLevel ? 0.28 : 0.10);
    lowEnergy += (low * SENSITIVITY - lowEnergy) * 0.20;
    midEnergy += (mid * SENSITIVITY - midEnergy) * 0.20;
    highEnergy += (high * SENSITIVITY - highEnergy) * 0.22;

    const now = performance.now();

    // Glitch rojo: aparece especialmente con agudos fuertes y ataques secos.
    if (
      now - lastRedGlitch > 120 &&
      (
        highEnergy > 0.13 ||
        (onset && high > 0.08) ||
        (pulse > 0.30 && highEnergy > 0.07)
      )
    ) {
      redGlitch = clamp(
        Math.max(redGlitch, highEnergy * 1.35 + pulse * 0.55),
        0,
        1
      );
      lastRedGlitch = now;
    }

    redGlitch *= 0.84;

    return {
      level: clamp(smoothLevel, 0, 1),
      low: clamp(lowEnergy, 0, 1),
      mid: clamp(midEnergy, 0, 1),
      high: clamp(highEnergy, 0, 1),
      pulse: clamp(pulse, 0, 1),
      red: clamp(redGlitch, 0, 1)
    };
  }


  function mutateQuietItem(item) {
    const oldText = item.text;

    // Palabras y símbolos van cambiando, pero de manera pausada.
    if (item.kind === 'calm') {
      let next = pick(calmWords);
      if (Math.random() < 0.18) next = pick(['eco','onda','pulso','aire','señal','afecto','ruido']);
      if (next === oldText) next = pick(calmWords);
      item.text = next;
    } else if (Math.random() < 0.22) {
      item.text = pick(denseWords);
    }

    // La composición también muta lentamente en silencio.
    item.baseX = clamp(item.baseX + rnd(-W * 0.08, W * 0.08), W * 0.18, W * 0.82);
    item.baseY = clamp(item.baseY + rnd(-H * 0.07, H * 0.07), H * 0.18, H * 0.82);
    item.baseRot = clamp(item.baseRot + rnd(-0.12, 0.12), -0.28, 0.28);
    item.scaleX = clamp(item.scaleX + rnd(-0.12, 0.12), 0.76, 1.26);
    item.scaleY = clamp(item.scaleY + rnd(-0.08, 0.08), 0.82, 1.14);
    item.floatAmpX = rnd(12, 38);
    item.floatAmpY = rnd(8, 30);
    item.floatSpeed = rnd(0.13, 0.42);
    item.phase += rnd(-1.2, 1.2);
  }

  function updateSilenceMutation(audio) {
    const now = performance.now();
    const isQuiet = audio.level < 0.045 && audio.pulse < 0.035;

    if (!isQuiet) {
      silenceStartedAt = now;
      return;
    }

    // Espera un pequeño momento antes de empezar a mutar.
    if (now - silenceStartedAt < 900) return;

    if (now - lastSilenceMutation >= nextSilenceMutation) {
      lastSilenceMutation = now;
      nextSilenceMutation = rnd(1300, 3200);

      const quietItems = items.filter(item => item.kind === 'calm');
      const changes = Math.min(
        quietItems.length,
        Math.random() < 0.35 ? 2 : 1
      );

      for (let i = 0; i < changes; i++) {
        const item = pick(quietItems);
        if (item) mutateQuietItem(item);
      }

      // Muy ocasionalmente muta un elemento grande que todavía está casi oculto.
      if (Math.random() < 0.18) {
        const dense = items.filter(item => item.kind === 'dense');
        const item = pick(dense);
        if (item) mutateQuietItem(item);
      }
    }
  }

  function renderScene(audio) {
    sctx.setTransform(1,0,0,1,0,0);
    sctx.clearRect(0,0,sw,sh);
    sctx.fillStyle = '#fff';
    sctx.fillRect(0,0,sw,sh);

    const calmOpacity = clamp(1 - audio.level * 1.05 - audio.pulse * 1.45, 0.14, 1);
    const denseOpacity = clamp(audio.level * 1.42 + audio.pulse * 1.65, 0, 1);

    for (const item of items) {
      item.update(audio);
      sctx.save();
      if (item.kind === 'calm') sctx.globalAlpha *= calmOpacity;
      else sctx.globalAlpha *= denseOpacity;
      drawWord(item, audio);
      sctx.restore();
    }

    const barCount = Math.floor(2 + audio.high * 12 + audio.pulse * 18);
    sctx.save();
    sctx.globalAlpha = clamp(audio.high * 0.16 + audio.pulse * 0.11, 0, 0.22);
    sctx.fillStyle = '#000';
    for (let i = 0; i < barCount; i++) {
      sctx.fillRect(rnd(0, sw), rnd(0, sh), rnd(sw * 0.04, sw * 0.30), rnd(1, 3));
    }
    sctx.restore();

    if (audio.pulse > 0.035 || audio.high > 0.08) {
      const sliceCount = Math.floor(2 + audio.pulse * 16 + audio.high * 10);
      const amp = Math.floor(2 + audio.pulse * 20 + audio.high * 8);
      for (let i = 0; i < sliceCount; i++) {
        const y = Math.floor(rnd(0, sh));
        const hh = Math.max(1, Math.floor(rnd(1, Math.max(2, 4 + audio.pulse * 10))));
        const dx = Math.floor(rnd(-amp, amp));
        try {
          const img = sctx.getImageData(0, y, sw, hh);
          sctx.putImageData(img, dx, y);
        } catch(e) {}
      }
    }

    const img = sctx.getImageData(0, 0, sw, sh);
    const px = img.data;
    const thresh = Math.floor(214 - audio.level * 42 - audio.pulse * 58 - audio.high * 16);
    const noiseAmt = 16 + audio.level * 18 + audio.pulse * 30 + audio.high * 12;

    for (let i = 0; i < px.length; i += 4) {
      const lum = 0.2126 * px[i] + 0.7152 * px[i+1] + 0.0722 * px[i+2];
      const n = (Math.random() - 0.5) * noiseAmt;
      let v = (lum + n > thresh) ? 255 : 0;

      if (Math.random() < 0.004 + audio.pulse * 0.018 + audio.high * 0.01) {
        v = (v === 255 ? 0 : 255);
      }

      px[i] = v; px[i+1] = v; px[i+2] = v; px[i+3] = 255;
    }
    sctx.putImageData(img, 0, 0);

    sctx.save();
    sctx.globalAlpha = clamp(0.04 + audio.high * 0.05 + audio.pulse * 0.04, 0.03, 0.12);
    sctx.fillStyle = '#000';
    for (let y = (frame % 3); y < sh; y += 3) sctx.fillRect(0, y, sw, 1);
    sctx.restore();
  }


  function drawRedGlitch(audio) {
    if (!audio.red || audio.red < 0.025) return;

    ctx.save();
    ctx.globalCompositeOperation = 'multiply';
    ctx.imageSmoothingEnabled = false;

    // Copias cromáticas horizontales, breves y agresivas.
    const slices = Math.floor(2 + audio.red * 10);
    for (let i = 0; i < slices; i++) {
      const y = rnd(H * 0.12, H * 0.88);
      const h = rnd(3, 28 + audio.red * 45);
      const dx = rnd(-1, 1) * (8 + audio.red * 42);

      ctx.globalAlpha = clamp(0.08 + audio.red * 0.20, 0.08, 0.28);
      ctx.fillStyle = '#ff0000';
      ctx.fillRect(
        rnd(W * 0.12, W * 0.72),
        y,
        rnd(W * 0.08, W * 0.30),
        Math.max(1, h * 0.18)
      );

      // Reutiliza una franja de la escena como desplazamiento rojo.
      try {
        const sy = Math.floor(y * dpr);
        const sh = Math.max(1, Math.floor(h * dpr));
        const strip = ctx.getImageData(0, sy, canvas.width, sh);

        // Tinta roja sobre píxeles oscuros
        const p = strip.data;
        for (let k = 0; k < p.length; k += 4) {
          const lum = (p[k] + p[k+1] + p[k+2]) / 3;
          if (lum < 170) {
            p[k] = 255;
            p[k+1] = 0;
            p[k+2] = 0;
            p[k+3] = Math.max(p[k+3], 180);
          } else {
            p[k+3] = 0;
          }
        }

        ctx.putImageData(strip, Math.floor(dx * dpr), sy);
      } catch(e) {}
    }

    // Destellos de símbolos rojos cerca del centro.
    if (audio.red > 0.18) {
      const marks = Math.floor(1 + audio.red * 5);
      ctx.globalAlpha = clamp(0.20 + audio.red * 0.35, 0.2, 0.5);
      ctx.fillStyle = '#ff0000';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      for (let i = 0; i < marks; i++) {
        const size = rnd(Math.min(W,H) * 0.035, Math.min(W,H) * 0.12);
        ctx.font = `900 italic ${size}px Georgia, "Times New Roman", serif`;
        ctx.save();
        ctx.translate(
          rnd(W * 0.28, W * 0.72),
          rnd(H * 0.26, H * 0.74)
        );
        ctx.rotate(rnd(-0.18, 0.18));
        ctx.fillText(pick(['RUIDO','ECO','////','†','×','PULSO']), 0, 0);
        ctx.restore();
      }
    }

    ctx.restore();
  }

  function presentScene(audio) {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.imageSmoothingEnabled = false;
    ctx.clearRect(0,0,W,H);
    ctx.fillStyle = '#fff';
    ctx.fillRect(0,0,W,H);

    ctx.drawImage(scene, 0, 0, W, H);

    if (audio.pulse > 0.05) {
      ctx.save();
      ctx.imageSmoothingEnabled = false;
      ctx.globalAlpha = clamp(audio.pulse * 0.18, 0.04, 0.18);
      ctx.drawImage(scene, Math.floor(rnd(-20, 20)), Math.floor(rnd(-4, 4)), W, H);
      ctx.restore();
    }

    drawRedGlitch(audio);
  }

  function drawMeter(audio) {
    const rect = meterCanvas.getBoundingClientRect();
    const w = rect.width;
    const h = rect.height;

    mctx.setTransform((meterCanvas.width / w), 0, 0, (meterCanvas.height / h), 0, 0);
    mctx.clearRect(0, 0, w, h);
    mctx.fillStyle = '#fff';
    mctx.fillRect(0, 0, w, h);

    const bars = 24;
    const gap = 2;
    const barW = (w - gap * (bars - 1)) / bars;
    const data = freqData;

    for (let i = 0; i < bars; i++) {
      let v = 0;
      if (data && analyser) {
        const start = Math.floor((i / bars) * data.length);
        const end = Math.max(start + 1, Math.floor(((i + 1) / bars) * data.length));
        for (let j = start; j < end; j++) v += data[j] / 255;
        v /= (end - start);
        v = clamp(v * 1.35, 0, 1);
      }

      const barH = Math.max(2, v * h);
      const x = i * (barW + gap);
      const y = h - barH;

      mctx.fillStyle = '#000';
      mctx.fillRect(x, y, Math.max(1, barW), barH);
    }

    // línea de pulso general
    mctx.fillStyle = '#000';
    mctx.fillRect(0, h - 2, w * audio.level, 2);

    // Curva perceptual para que también se vea claramente el sonido suave.
    const visibleLevel = clamp(Math.pow(audio.level, 0.72), 0, 1);
    const pct = Math.round(visibleLevel * 100);
    levelFill.style.width = pct + '%';
    levelText.textContent = pct + '%';
  }

  async function enableMic() {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') await audioCtx.resume();

    stream = await navigator.mediaDevices.getUserMedia({
      audio: {
        echoCancellation: false,
        noiseSuppression: false,
        autoGainControl: false
      }
    });

    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 2048;
    analyser.smoothingTimeConstant = 0.10;

    freqData = new Uint8Array(analyser.frequencyBinCount);
    timeData = new Uint8Array(analyser.fftSize);
    prevFreq = new Float32Array(analyser.frequencyBinCount);

    const src = audioCtx.createMediaStreamSource(stream);
    src.connect(analyser);
    micActive = true;
  }

  function disableMic() {
    if (stream) {
      stream.getTracks().forEach(t => t.stop());
      stream = null;
    }
    analyser = null;
    freqData = null;
    timeData = null;
    prevFreq = null;
    micActive = false;
    smoothLevel = 0;
    lowEnergy = 0;
    midEnergy = 0;
    highEnergy = 0;
    pulse = 0;
    fluxAvg = 0;
    redGlitch = 0;
    levelFill.style.width = '0%';
    levelText.textContent = '0%';
  }

  async function toggleMic() {
    try {
      if (!micActive) await enableMic();
      else disableMic();
    } catch (err) {
      console.error(err);
      disableMic();
    }
  }

  function render() {
    frame++;
    const audio = getAudio();
    updateSilenceMutation(audio);
    renderScene(audio);
    presentScene(audio);
    drawMeter(audio);
    requestAnimationFrame(render);
  }

  button.addEventListener('click', toggleMic);
  window.addEventListener('resize', resize);

  resize();
  render();
})();
</script>
</body>
</html>
